<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jojo's Webpage</title>
</head>

<body>

    <!-- ============================
         Main Heading
         ============================ -->
    <h1>PRE Tags</h1>


    <!-- ============================
         PRE Tag Example
         The <pre> tag preserves:
         - whitespace
         - line breaks
         - indentation
         ============================ -->
    <pre>
We are the music makers
we are the dreamers of dreams
wandering by lone sea breakers
and sitting by desolate seas
    </pre>


    <!-- ============================
         Same text WITHOUT <pre>
         Using <br> for manual line breaks
         ============================ -->
    <p>
        We are the music makers<br>
        we are the dreamers of dreams<br>
        wandering by lone sea breakers<br>
        and sitting by desolate seas<br>
    </p>

</body>

</html>
