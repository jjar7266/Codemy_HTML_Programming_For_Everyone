<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jojo's Website</title>
</head>

<body>

    <!-- ============================
         Main Heading
         ============================ -->
    <h1>Links in HTML</h1>


    <!-- ============================
         External Link Example
         target="_blank" opens
         the link in a new tab
         ============================ -->
    <p>
        <a href="https://github.com/jjar7266?tab=repositories" target="_blank">
            My GitHub Page
        </a>
    </p>


    <!-- ============================
         Lesson Link Example
         Another external link
         ============================ -->
    <p>
        <a href="https://member.codemy.com/video/312" target="_blank">
            Lesson Link (Codemy.com)
        </a>
    </p>


    <!-- ============================
         Internal Link Example
         Demonstrates linking to
         another page in the same folder.
         Requires about.html to exist.
         ============================ -->
    <p>
        <a href="about.html">About Page (Internal Link Example)</a>
    </p>

</body>

</html>
